name: Unpack academy
on:
  push:
    paths:
      - "_upload/**"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode tarball and commit the complete academy
        run: |
          set -euo pipefail
          test -f _upload/part-000.txt
          echo "parts=$(ls _upload/part-*.txt | wc -l)"
          cat _upload/part-*.txt | base64 -d > /tmp/academy.tar.gz
          tar -tzf /tmp/academy.tar.gz
          tar -xzf /tmp/academy.tar.gz
          rm -rf _upload
          rm -f js/app-rest.js
          python3 - <<'PY'
          import hashlib, pathlib, sys
          man = pathlib.Path("MANIFEST.tsv")
          if not man.exists():
              raise SystemExit("MANIFEST.tsv missing after unpack")
          bad = []
          n = 0
          for line in man.read_text(encoding="utf-8").splitlines()[1:]:
              if not line.strip():
                  continue
              path, size, expect = line.split("\t")
              n += 1
              p = pathlib.Path(path)
              if not p.is_file():
                  bad.append(f"missing {path}")
                  continue
              h = hashlib.sha256(p.read_bytes()).hexdigest()
              if str(p.stat().st_size) != size or h != expect:
                  bad.append(f"mismatch {path} size={p.stat().st_size} hash={h} expected {size} {expect}")
          if bad:
              print("\n".join(bad), file=sys.stderr)
              raise SystemExit(1)
          print("MANIFEST_OK", n, "files")
          PY
          git config user.name "Sanifect"
          git config user.email "204092174+Sanifect@users.noreply.github.com"
          git add -A
          git status
          git commit -m "Unpack complete Sanifect SME Academy (HTML CSS JS PNG SVG README start.ps1)"
          git push
